<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB — Place Details</title>
    <link rel="icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <img src="logo.png" class="logo" alt="HBnB Logo">
    <a href="login.html" id="login-link" class="login-button">Login</a>
</header>

<nav>
    <a href="index.html">Home</a>
</nav>

<main>
    <section id="place-details" class="place-details"></section>

    <section id="add-review" class="add-review" style="display:none;">
        <h2>Add a Review</h2>
        <form id="review-form" class="form">
            <div class="field">
                <label for="review-text">Your review</label>
                <textarea id="review-text" placeholder="What did you think of this place?" required></textarea>
            </div>
            <div class="field">
                <label for="rating">Rating</label>
                <select id="rating">
                    <option value="1">1 ★</option>
                    <option value="2">2 ★★</option>
                    <option value="3" selected>3 ★★★</option>
                    <option value="4">4 ★★★★</option>
                    <option value="5">5 ★★★★★</option>
                </select>
            </div>
            <button type="submit">Submit Review</button>
            <div class="success-msg" id="success-msg" style="display:none;">Review submitted!</div>
            <div class="error-msg" id="error-msg" style="display:none;">Could not submit review.</div>
        </form>
    </section>
</main>

<footer>
    <p>© 2025 HBnB — All rights reserved</p>
</footer>

<script src="scripts.js"></script>
</body>
</html>
