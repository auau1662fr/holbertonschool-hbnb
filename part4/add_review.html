<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB — Add Review</title>
    <link rel="icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <img src="logo.png" class="logo" alt="HBnB Logo">
    <a href="login.html" class="login-button">Login</a>
</header>

<nav>
    <a href="index.html">Home</a>
</nav>

<main>
    <div class="form-container">
        <h1>Leave a Review</h1>
        <p class="form-sub">Share your experience with other travelers</p>

        <form id="review-form" class="form">
            <div class="field">
                <label for="review-text">Your review</label>
                <textarea id="review-text" placeholder="What did you think of this place?" required></textarea>
            </div>
            <div class="field">
                <label for="rating">Rating</label>
                <select id="rating">
                    <option value="1">1 ★</option>
                    <option value="2">2 ★★</option>
                    <option value="3" selected>3 ★★★</option>
                    <option value="4">4 ★★★★</option>
                    <option value="5">5 ★★★★★</option>
                </select>
            </div>
            <button type="submit">Submit Review</button>
            <div class="success-msg" id="success-msg" style="display:none;">Review submitted! Redirecting...</div>
            <div class="error-msg" id="error-msg" style="display:none;">Could not submit review. Please try again.</div>
        </form>
    </div>
</main>

<footer>
    <p>© 2025 HBnB — All rights reserved</p>
</footer>

<script src="scripts.js"></script>
</body>
</html>
