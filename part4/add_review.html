<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB — Add Review</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --border: #2e2e2e;
            --accent: #e8c97e;
            --accent-dim: rgba(232, 201, 126, 0.15);
            --text: #f0ece4;
            --muted: #777;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 48px;
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 1;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--accent);
            letter-spacing: 0.05em;
        }

        .logo-text span { color: var(--text); opacity: 0.4; font-weight: 400; }

        .back-link {
            color: var(--muted);
            font-size: 0.88rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--text); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            position: relative;
            z-index: 1;
        }

        main::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(232, 201, 126, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .review-card {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px;
            position: relative;
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .review-card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-sub {
            font-size: 0.88rem;
            color: var(--muted);
            margin-bottom: 36px;
            font-weight: 300;
        }

        .field { margin-bottom: 24px; }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 13px 16px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 120px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        textarea::placeholder { color: #444; }

        /* Star rating */
        .stars {
            display: flex;
            gap: 8px;
            flex-direction: row-reverse;
            justify-content: flex-end;
        }

        .stars input[type="radio"] { display: none; }

        .stars label {
            font-size: 2rem;
            color: var(--border);
            cursor: pointer;
            transition: color 0.15s, transform 0.1s;
            text-transform: none;
            letter-spacing: 0;
            margin-bottom: 0;
        }

        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: var(--accent);
        }

        .stars label:hover { transform: scale(1.15); }

        .btn {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            background: var(--accent);
            color: #0f0f0f;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .success-msg {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(80, 200, 120, 0.1);
            border: 1px solid rgba(80, 200, 120, 0.3);
            border-radius: 8px;
            color: #5cc888;
            font-size: 0.88rem;
            text-align: center;
        }

        .error-msg {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid rgba(255, 80, 80, 0.3);
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 0.88rem;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 24px;
            font-size: 0.78rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-text">HB<span>n</span>B</div>
    <a href="javascript:history.back()" class="back-link">← Back to place</a>
</header>

<main>
    <div class="review-card">
        <h1 class="card-title">Leave a review</h1>
        <p class="card-sub">Share your experience with other travelers</p>

        <form id="review-form">
            <div class="field">
                <label for="review-text">Your review</label>
                <textarea id="review-text" placeholder="What did you think of this place?" required></textarea>
            </div>

            <div class="field">
                <label>Rating</label>
                <div class="stars">
                    <input type="radio" id="star5" name="rating" value="5">
                    <label for="star5" title="5 stars">★</label>
                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4" title="4 stars">★</label>
                    <input type="radio" id="star3" name="rating" value="3" checked>
                    <label for="star3" title="3 stars">★</label>
                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2" title="2 stars">★</label>
                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1" title="1 star">★</label>
                </div>
            </div>

            <button type="submit" class="btn">Submit review</button>
            <div class="success-msg" id="success-msg">Review submitted! Redirecting...</div>
            <div class="error-msg" id="error-msg">Could not submit review. Please try again.</div>
        </form>
    </div>
</main>

<footer>
    <p>© 2025 HBnB — All rights reserved</p>
</footer>

<script>
    function getCookie(name) {
        return document.cookie
            .split('; ')
            .find(row => row.startsWith(name))
            ?.split('=')[1];
    }

    document.addEventListener('DOMContentLoaded', () => {
        const token = getCookie('token');
        const params = new URLSearchParams(window.location.search);
        const placeId = params.get('id');

        // Redirect to login if not authenticated
        if (!token) {
            window.location.href = `login.html?redirect=add_review.html${placeId ? '?id=' + placeId : ''}`;
            return;
        }

        const form = document.getElementById('review-form');
        const successMsg = document.getElementById('success-msg');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            const text = document.getElementById('review-text').value;
            const rating = parseInt(document.querySelector('input[name="rating"]:checked')?.value || 3);

            try {
                const response = await fetch('http://127.0.0.1:5000/api/v1/reviews', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ text, rating, place_id: placeId })
                });

                if (response.ok) {
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = `place.html?id=${placeId}`;
                    }, 1500);
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.style.display = 'block';
                console.error(err);
            }
        });
    });
</script>
</body>
</html>
