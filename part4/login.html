<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB — Login</title>
    <link rel="icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <img src="logo.png" class="logo" alt="HBnB Logo">
    <a href="index.html" class="login-button">Home</a>
</header>

<nav>
    <a href="index.html">Home</a>
</nav>

<main>
    <div class="form-container">
        <h1>Welcome back</h1>
        <p class="form-sub">Sign in to your account</p>

        <form id="login-form" class="form">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Sign in</button>
            <div class="error-msg" id="error-msg">Invalid email or password.</div>
        </form>
    </div>
</main>

<footer>
    <p>© 2025 HBnB — All rights reserved</p>
</footer>

<script src="scripts.js"></script>
</body>
</html>
